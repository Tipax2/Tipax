<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f3f8f5">
<title>ورود | تیپاکس</title>
<style>
:root{
  --bg:#f3f8f5;--bg2:#eaf4ee;--text:#14241c;--muted:#75837b;
  --green:#10a86b;--green2:#087d4e;--glass:rgba(255,255,255,.58);
  --stroke:rgba(255,255,255,.9);--danger:#d85b62;
  --shadow:0 30px 90px rgba(26,82,56,.15)
}
body.dark{
  --bg:#07110c;--bg2:#0c2117;--text:#effff6;--muted:#9aafa4;
  --green:#39d994;--green2:#20b878;--glass:rgba(15,39,28,.62);
  --stroke:rgba(255,255,255,.1);--shadow:0 30px 90px rgba(0,0,0,.43)
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:grid;place-items:center;overflow:hidden;
  color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 15%,rgba(16,168,107,.18),transparent 25%),
    radial-gradient(circle at 88% 78%,rgba(57,217,148,.12),transparent 28%),
    linear-gradient(135deg,var(--bg),var(--bg2));transition:.4s
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(10px)
}
body:before{width:400px;height:400px;right:-170px;top:-130px;background:#10a86b12}
body:after{width:330px;height:330px;left:-140px;bottom:-100px;background:#39d99412}
.wrap{width:min(430px,calc(100% - 30px));position:relative}
.theme{
  position:fixed;top:22px;left:22px;width:44px;height:44px;border-radius:15px;
  border:1px solid var(--stroke);background:var(--glass);color:var(--text);
  backdrop-filter:blur(20px);box-shadow:0 12px 35px #164f3510;cursor:pointer;font-size:17px
}
.card{
  position:relative;overflow:hidden;padding:38px 34px 32px;border-radius:34px;
  border:1px solid var(--stroke);background:var(--glass);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.65)
}
.card:before{
  content:"";position:absolute;width:280px;height:280px;right:-160px;top:-180px;
  border-radius:50%;background:#10a86b12;filter:blur(7px)
}
.logo{
  width:68px;height:68px;margin:0 auto 18px;display:grid;place-items:center;
  border-radius:23px;color:#fff;font-size:19px;font-weight:900;
  background:linear-gradient(145deg,var(--green),var(--green2));
  box-shadow:0 18px 40px #10a86b35,inset 0 1px #fff7;position:relative;overflow:hidden
}
.logo:after{
  content:"";position:absolute;width:90px;height:12px;background:#ffffff45;
  transform:rotate(-28deg) translateX(-100px);filter:blur(7px);animation:shine 5s infinite
}
@keyframes shine{0%,58%{transform:rotate(-28deg) translateX(-100px);opacity:0}68%{opacity:1}82%,100%{transform:rotate(-28deg) translateX(100px);opacity:0}}
h1{text-align:center;font-size:25px;margin-bottom:8px;position:relative}
.sub{text-align:center;color:var(--muted);font-size:11px;line-height:2;margin-bottom:28px;position:relative}
.field{margin-bottom:16px;position:relative}
label{display:block;font-size:10px;font-weight:bold;margin:0 4px 8px}
.input-wrap{position:relative}
input{
  width:100%;height:52px;padding:0 16px 0 48px;border-radius:17px;
  border:1px solid var(--stroke);outline:none;background:rgba(255,255,255,.42);
  color:var(--text);font-family:inherit;font-size:12px;direction:ltr;text-align:left;
  box-shadow:inset 0 1px rgba(255,255,255,.45),0 8px 25px #164f3505;
  transition:.25s
}
body.dark input{background:rgba(0,0,0,.12)}
input:focus{border-color:#10a86b66;box-shadow:0 0 0 4px #10a86b12,0 10px 30px #10a86b0b}
.eye{
  position:absolute;left:8px;top:7px;width:38px;height:38px;border:0;border-radius:12px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:16px
}
.remember{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;margin:5px 3px 21px}
.remember input{width:15px;height:15px;padding:0;accent-color:var(--green);box-shadow:none}
.submit{
  width:100%;height:54px;border:0;border-radius:18px;color:#fff;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:bold;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:0 18px 38px #10a86b32,inset 0 1px #fff4;transition:.3s
}
.submit:hover{transform:translateY(-3px);box-shadow:0 23px 45px #10a86b3d}
.back{
  display:block;text-align:center;margin-top:18px;color:var(--muted);text-decoration:none;font-size:10px
}
.error{
  display:none;color:var(--danger);background:#d85b6210;border:1px solid #d85b6225;
  border-radius:13px;padding:10px;margin-bottom:14px;text-align:center;font-size:10px
}
.error.show{display:block}
.note{text-align:center;color:var(--muted);font-size:8px;margin-top:17px;line-height:1.8}
@media(max-width:500px){.card{padding:32px 23px 27px;border-radius:28px}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تغییر حالت">☾</button>

<main class="wrap">
  <section class="card">
    <div class="logo">tipax</div>
    <h1>ورود به سامانه</h1>
    <p class="sub">برای ورود به پنل مدیریت شعبه، رمز عبور خود را وارد کنید.</p>

    <div class="error" id="error">رمز عبور وارد شده صحیح نیست.</div>

    <form id="loginForm">
      <div class="field">
        <label for="password">رمز عبور</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="current-password"
                 placeholder="رمز عبور را وارد کنید">
          <button class="eye" id="eye" type="button" aria-label="نمایش رمز">◉</button>
        </div>
      </div>

      <label class="remember">
        <input id="remember" type="checkbox">
        مرا به خاطر بسپار
      </label>

      <button class="submit" type="submit">ورود به سامانه</button>
    </form>

    <a class="back" href="index.html">بازگشت به صفحه اصلی</a>
  </section>

  <p class="note">
    Tipax Management System • نسخه اولیه<br>
    احراز هویت نهایی در نسخه سروری پیاده‌سازی خواهد شد.
  </p>
</main>

<script>
const body=document.body;
const theme=document.getElementById("theme");
const form=document.getElementById("loginForm");
const password=document.getElementById("password");
const eye=document.getElementById("eye");
const error=document.getElementById("error");

function applyTheme(t){
  body.classList.toggle("dark",t==="dark");
  theme.textContent=t==="dark"?"☀":"☾";
  localStorage.setItem("tipax-theme",t);
}
applyTheme(localStorage.getItem("tipax-theme")||"light");
theme.onclick=()=>applyTheme(body.classList.contains("dark")?"light":"dark");

eye.onclick=()=>{
  const visible=password.type==="text";
  password.type=visible?"password":"text";
  eye.textContent=visible?"◉":"◌";
};

form.onsubmit=(e)=>{
  e.preventDefault();
  error.classList.remove("show");

  /*
    رمز موقت فقط برای مرحله طراحی:
    بعداً این قسمت به احراز هویت واقعی متصل می‌شود.
  */
  const TEMP_PASSWORD="1234";

  if(password.value===TEMP_PASSWORD){
    sessionStorage.setItem("tipax-auth","1");
    window.location.href="pages/manage.html";
  }else{
    error.classList.add("show");
    password.focus();
  }
};
</script>
</body>
</html>
